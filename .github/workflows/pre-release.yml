name: Pre-release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prerelease:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move latest tag to current commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin refs/tags/latest --force

      - name: Create or update prerelease
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "latest";
            const target = context.sha;

            let existing = null;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag
              });
              existing = response.data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const payload = {
              owner,
              repo,
              tag_name: tag,
              target_commitish: target,
              name: "Development Build",
              body: `Automated prerelease for ${target}.`,
              prerelease: true,
              draft: false
            };

            if (existing) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.id,
                name: payload.name,
                body: payload.body,
                prerelease: true,
                draft: false
              });
            } else {
              await github.rest.repos.createRelease(payload);
            }