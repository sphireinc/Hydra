name: hydra-functional-tests

services:
  mysql:
    image: mysql:8.4
    container_name: hydra-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations/mysql.sql:/docker-entrypoint-initdb.d/001-mysql.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - hydra-net

  mariadb:
    image: mariadb:11
    container_name: hydra-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: testdb
      MARIADB_USER: testuser
      MARIADB_PASSWORD: testpassword
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./migrations/mariadb.sql:/docker-entrypoint-initdb.d/001-mariadb.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - hydra-net

  postgres:
    image: postgres:16
    container_name: hydra-postgres
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/postgres.sql:/docker-entrypoint-initdb.d/001-postgres.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - hydra-net

  mssql:
    profiles: [ "mssql" ]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hydra-mssql
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword!123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - hydra-net

  mssql-init:
    profiles: [ "mssql" ]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hydra-mssql-init
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "YourStrongPassword!123"
    volumes:
      - ./migrations/mssql.sql:/migrations/mssql.sql:ro
    entrypoint: [ "/bin/bash", "-lc" ]
    command: >
      set -euo pipefail;
      /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "IF DB_ID(N'testdb') IS NULL CREATE DATABASE testdb;";
      /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P "$${MSSQL_SA_PASSWORD}" -d testdb -i /migrations/mssql.sql
    restart: "no"
    networks:
      - hydra-net

  oracle:
    profiles: [ "oracle" ]
    image: gvenzl/oracle-xe:21-slim
    container_name: hydra-oracle
    platform: linux/amd64
    environment:
      ORACLE_PASSWORD: "oraclepassword"
      APP_USER: "hydra"
      APP_USER_PASSWORD: "hydrapassword"
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - hydra-net

  oracle-init:
    profiles: [ "oracle" ]
    image: gvenzl/oracle-xe:21-slim
    container_name: hydra-oracle-init
    platform: linux/amd64
    depends_on:
      oracle:
        condition: service_healthy
    volumes:
      - ./migrations/oracle.sql:/migrations/oracle.sql:ro
    entrypoint: [ "/bin/bash", "-lc" ]
    command: >
      set -euo pipefail;
      sqlplus -s hydra/hydrapassword@//oracle:1521/XEPDB1 @/migrations/oracle.sql
    restart: "no"
    networks:
      - hydra-net

  cockroachdb:
    image: cockroachdb/cockroach:v25.3.3
    container_name: hydra-cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    environment:
      COCKROACH_DATABASE: testdb
      COCKROACH_USER: root
    volumes:
      - cockroach-data:/cockroach/cockroach-data
      - ./migrations/cockroachdb.sql:/docker-entrypoint-initdb.d/001-cockroachdb.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "cockroach sql --insecure --host=localhost:26257 --execute='SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - hydra-net

  test-runner:
    build:
      context: ..
      dockerfile: functional_tests/Dockerfile
    container_name: hydra-test-runner
    depends_on:
      mysql:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      cockroachdb:
        condition: service_healthy
    environment:
      CGO_ENABLED: "1"
      HYDRA_MYSQL_DSN: "testuser:testpassword@tcp(mysql:3306)/testdb?parseTime=true"
      HYDRA_MARIADB_DSN: "testuser:testpassword@tcp(mariadb:3306)/testdb?parseTime=true"
      HYDRA_POSTGRES_DSN: "postgres://testuser:testpassword@postgres:5432/testdb?sslmode=disable"
      HYDRA_MSSQL_DSN: "${HYDRA_MSSQL_DSN:-}"
      HYDRA_ORACLE_DSN: "${HYDRA_ORACLE_DSN:-}"
      HYDRA_COCKROACHDB_DSN: "postgres://root@cockroachdb:26257/testdb?sslmode=disable"
    networks:
      - hydra-net
    entrypoint: [ "/bin/bash", "/app/functional_tests/wait-and-test.sh" ]

volumes:
  mysql-data:
  mariadb-data:
  postgres-data:
  mssql-data:
  oracle-data:
  cockroach-data:

networks:
  hydra-net:
    driver: bridge